<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  :root {
    --bg-1: #0f172a;
    --bg-2: #1e293b;
    --board-bg: #0b1220;
    --grid-line: rgba(148, 163, 184, 0.06);
    --accent: #22d3ee;
    --accent-2: #34d399;
    --food: #f472b6;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --panel: rgba(15, 23, 42, 0.7);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 30% 20%, var(--bg-2), var(--bg-1) 70%);
    color: var(--text);
    overflow: hidden;
  }

  .game-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 20px;
  }

  h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: 4px;
    font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(34, 211, 238, 0.25);
  }

  .hud {
    display: flex;
    gap: 28px;
    padding: 10px 24px;
    background: var(--panel);
    border: 1px solid rgba(148, 163, 184, 0.15);
    border-radius: 12px;
    backdrop-filter: blur(6px);
    font-size: 15px;
    min-width: 420px;
    justify-content: space-between;
  }

  .hud .label {
    color: var(--muted);
    margin-right: 6px;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 1px;
  }

  .hud .value {
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  .board-shell {
    position: relative;
    border-radius: 16px;
    padding: 10px;
    background: linear-gradient(145deg, #1e293b, #0b1220);
    box-shadow:
      0 0 0 1px rgba(148, 163, 184, 0.12),
      0 20px 60px rgba(0, 0, 0, 0.55),
      inset 0 0 30px rgba(0,0,0,0.3);
  }

  canvas {
    display: block;
    border-radius: 10px;
    background: var(--board-bg);
  }

  .overlay {
    position: absolute;
    inset: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(4, 8, 20, 0.78);
    border-radius: 10px;
    text-align: center;
    padding: 20px;
    backdrop-filter: blur(3px);
    transition: opacity 0.2s ease;
  }

  .overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .overlay h2 {
    margin: 0;
    font-size: 26px;
    color: var(--text);
    letter-spacing: 1px;
  }

  .overlay p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
    max-width: 280px;
    line-height: 1.5;
  }

  .overlay .accent {
    color: var(--accent-2);
    font-weight: 700;
  }

  .btn {
    margin-top: 6px;
    padding: 10px 26px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #04121a;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(34, 211, 238, 0.35);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }

  .btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(34, 211, 238, 0.5);
  }

  .btn:active {
    transform: translateY(0px) scale(0.98);
  }

  .hint {
    color: var(--muted);
    font-size: 12.5px;
    text-align: center;
    line-height: 1.6;
  }

  .hint kbd {
    background: rgba(148, 163, 184, 0.14);
    border: 1px solid rgba(148, 163, 184, 0.3);
    border-radius: 5px;
    padding: 1px 7px;
    font-size: 11px;
    color: var(--text);
  }

  .dpad {
    display: none;
    grid-template-columns: repeat(3, 46px);
    grid-template-rows: repeat(3, 46px);
    gap: 6px;
    margin-top: 4px;
  }

  .dpad button {
    border-radius: 10px;
    border: 1px solid rgba(148,163,184,0.2);
    background: rgba(148,163,184,0.08);
    color: var(--accent);
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
  }
  .dpad button:active { background: rgba(34,211,238,0.25); }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 3; }

  @media (max-width: 520px) {
    .hud { min-width: 0; width: 100%; font-size: 13px; gap: 14px; }
    .dpad { display: grid; }
  }
</style>
</head>
<body>
  <div class="game-wrap">
    <h1>SNAKE</h1>

    <div class="hud">
      <div><span class="label">Score</span><span class="value" id="score">0</span></div>
      <div><span class="label">Best</span><span class="value" id="best">0</span></div>
      <div><span class="label">Speed</span><span class="value" id="speed">1</span></div>
    </div>

    <div class="board-shell">
      <canvas id="board" width="480" height="480"></canvas>

      <div class="overlay" id="overlay">
        <h2 id="overlayTitle">Ready to Play?</h2>
        <p id="overlayText">Use the <span class="accent">arrow keys</span> to steer the snake, eat the glowing orbs, and avoid hitting the walls or yourself.</p>
        <button class="btn" id="startBtn">Start Game</button>
      </div>
    </div>

    <div class="hint">
      Move with <kbd>&#8592;</kbd> <kbd>&#8593;</kbd> <kbd>&#8594;</kbd> <kbd>&#8595;</kbd> or <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> &nbsp;&middot;&nbsp; <kbd>Space</kbd> to pause
    </div>

    <div class="dpad" id="dpad">
      <button class="up" data-dir="up">&#8593;</button>
      <button class="left" data-dir="left">&#8592;</button>
      <button class="right" data-dir="right">&#8594;</button>
      <button class="down" data-dir="down">&#8595;</button>
    </div>
  </div>

<script>
(function () {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const speedEl = document.getElementById('speed');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');
  const dpad = document.getElementById('dpad');

  const GRID = 24;
  const CELL = canvas.width / GRID;

  const BASE_SPEED_MS = 900;
  const MIN_SPEED_MS = 60;

  let snake, dir, nextDir, food, score, best, running, paused, loopId, moveInterval, tickAccumulator, lastTime, level;

  best = Number(localStorage.getItem('snakeBest') || 0);
  bestEl.textContent = best;

  function resetState() {
    const cx = Math.floor(GRID / 2);
    const cy = Math.floor(GRID / 2);
    snake = [
      { x: cx - 1, y: cy },
      { x: cx - 2, y: cy },
      { x: cx - 3, y: cy },
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    level = 1;
    moveInterval = BASE_SPEED_MS;
    tickAccumulator = 0;
    lastTime = 0;
    placeFood();
    scoreEl.textContent = score;
    speedEl.textContent = level;
  }

  function placeFood() {
    let valid = false;
    let fx, fy;
    while (!valid) {
      fx = Math.floor(Math.random() * GRID);
      fy = Math.floor(Math.random() * GRID);
      valid = !snake.some(s => s.x === fx && s.y === fy);
    }
    food = { x: fx, y: fy, pulse: 0 };
  }

  function drawGrid() {
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--board-bg').trim() || '#0b1220';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = 'rgba(148, 163, 184, 0.06)';
    ctx.lineWidth = 1;
    for (let i = 1; i < GRID; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL);
      ctx.lineTo(canvas.width, i * CELL);
      ctx.stroke();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawFood(time) {
    const pad = 3;
    const x = food.x * CELL + CELL / 2;
    const y = food.y * CELL + CELL / 2;
    const pulse = 1 + Math.sin(time / 180) * 0.12;
    const r = (CELL / 2 - pad) * pulse;

    const grad = ctx.createRadialGradient(x, y, 1, x, y, r * 2.2);
    grad.addColorStop(0, 'rgba(244, 114, 182, 0.9)');
    grad.addColorStop(1, 'rgba(244, 114, 182, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, r * 2.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#f472b6';
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.28, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawSnake() {
    for (let i = snake.length - 1; i >= 0; i--) {
      const seg = snake[i];
      const isHead = i === 0;
      const x = seg.x * CELL;
      const y = seg.y * CELL;
      const pad = isHead ? 1 : 2;

      let color;
      if (isHead) {
        color = '#22d3ee';
      } else {
        const t = i / snake.length;
        color = lerpColor('#22d3ee', '#34d399', t);
      }

      ctx.fillStyle = color;
      ctx.shadowColor = isHead ? 'rgba(34, 211, 238, 0.7)' : 'transparent';
      ctx.shadowBlur = isHead ? 12 : 0;
      roundRect(x + pad, y + pad, CELL - pad * 2, CELL - pad * 2, isHead ? 7 : 5);
      ctx.fill();
      ctx.shadowBlur = 0;

      if (isHead) {
        drawEyes(x, y);
      }
    }
  }

  function drawEyes(x, y) {
    const eyeR = CELL * 0.09;
    let ex1, ey1, ex2, ey2;
    const off = CELL * 0.28;
    const mid = CELL / 2;

    if (dir.x === 1) { ex1 = mid + off; ey1 = mid - off; ex2 = mid + off; ey2 = mid + off; }
    else if (dir.x === -1) { ex1 = mid - off; ey1 = mid - off; ex2 = mid - off; ey2 = mid + off; }
    else if (dir.y === -1) { ex1 = mid - off; ey1 = mid - off; ex2 = mid + off; ey2 = mid - off; }
    else { ex1 = mid - off; ey1 = mid + off; ex2 = mid + off; ey2 = mid + off; }

    ctx.fillStyle = '#04121a';
    ctx.beginPath();
    ctx.arc(x + ex1, y + ey1, eyeR, 0, Math.PI * 2);
    ctx.arc(x + ex2, y + ey2, eyeR, 0, Math.PI * 2);
    ctx.fill();
  }

  function lerpColor(a, b, t) {
    const ca = hexToRgb(a), cb = hexToRgb(b);
    const r = Math.round(ca.r + (cb.r - ca.r) * t);
    const g = Math.round(ca.g + (cb.g - ca.g) * t);
    const bl = Math.round(ca.b + (cb.b - ca.b) * t);
    return `rgb(${r}, ${g}, ${bl})`;
  }

  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }

  function update() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID || snake.some(s => s.x === head.x && s.y === head.y)) {
      gameOver();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem('snakeBest', best);
      }
      const newLevel = Math.floor(score / 50) + 1;
      if (newLevel !== level) {
        level = newLevel;
        speedEl.textContent = level;
        moveInterval = Math.max(MIN_SPEED_MS, BASE_SPEED_MS - (level - 1) * 8);
      }
      placeFood();
    } else {
      snake.pop();
    }
  }

  function render(time) {
    drawGrid();
    drawFood(time);
    drawSnake();
  }

  function frame(time) {
    if (!running || paused) return;
    if (!lastTime) lastTime = time;
    const dt = time - lastTime;
    lastTime = time;
    tickAccumulator += dt;

    if (tickAccumulator >= moveInterval) {
      tickAccumulator = 0;
      update();
      if (!running) return;
    }

    render(time);
    loopId = requestAnimationFrame(frame);
  }

  function gameOver() {
    running = false;
    cancelAnimationFrame(loopId);
    overlayTitle.textContent = 'Game Over';
    overlayText.innerHTML = `You scored <span class="accent">${score}</span> points.${score >= best && score > 0 ? ' New best!' : ''}`;
    startBtn.textContent = 'Play Again';
    overlay.classList.remove('hidden');
  }

  function startGame() {
    resetState();
    overlay.classList.add('hidden');
    running = true;
    paused = false;
    lastTime = 0;
    render(0);
    loopId = requestAnimationFrame(frame);
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) {
      overlayTitle.textContent = 'Paused';
      overlayText.textContent = 'Press Space or the button to resume.';
      startBtn.textContent = 'Resume';
      overlay.classList.remove('hidden');
    } else {
      overlay.classList.add('hidden');
      lastTime = 0;
      loopId = requestAnimationFrame(frame);
    }
  }

  function setDirection(nx, ny) {
    if (!running) return;
    if (snake.length > 1 && nx === -dir.x && ny === -dir.y) return;
    nextDir = { x: nx, y: ny };
  }

  window.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'ArrowUp': case 'w': case 'W': e.preventDefault(); setDirection(0, -1); break;
      case 'ArrowDown': case 's': case 'S': e.preventDefault(); setDirection(0, 1); break;
      case 'ArrowLeft': case 'a': case 'A': e.preventDefault(); setDirection(-1, 0); break;
      case 'ArrowRight': case 'd': case 'D': e.preventDefault(); setDirection(1, 0); break;
      case ' ':
        e.preventDefault();
        if (running) togglePause();
        break;
    }
  });

  startBtn.addEventListener('click', () => {
    if (paused) { togglePause(); return; }
    startGame();
  });

  dpad.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-dir]');
    if (!btn) return;
    const d = btn.dataset.dir;
    if (d === 'up') setDirection(0, -1);
    if (d === 'down') setDirection(0, 1);
    if (d === 'left') setDirection(-1, 0);
    if (d === 'right') setDirection(1, 0);
  });

  let touchStartX = 0, touchStartY = 0;
  canvas.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  }, { passive: true });

  canvas.addEventListener('touchend', (e) => {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (Math.abs(dx) > 20) setDirection(dx > 0 ? 1 : -1, 0);
    } else {
      if (Math.abs(dy) > 20) setDirection(0, dy > 0 ? 1 : -1);
    }
  }, { passive: true });

  resetState();
  render(0);
})();
</script>
</body>
</html>
